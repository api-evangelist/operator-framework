aid: operator-framework
name: Operator Framework
description: >-
  The Operator Framework is a CNCF incubating toolkit for building and
  managing Kubernetes Operators. It includes the Operator SDK for scaffolding
  and building operators using Go, Ansible, or Helm, the Operator Lifecycle
  Manager (OLM) for installing and managing operators on clusters, and
  OperatorHub for discovering and sharing operators. The framework codifies
  operational knowledge into software.
