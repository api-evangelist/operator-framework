apis:
  - aid: operator-framework:olm-api
    name: Operator Lifecycle Manager API
    description: >-
      OLM extends Kubernetes with CRDs for operator lifecycle management
      including ClusterServiceVersion for describing operator capabilities
      and requirements, Subscription for tracking update channels,
      InstallPlan for managing operator installation, CatalogSource for
      defining operator repositories, and OperatorGroup for multi-tenant
      operator deployment scoping.
    humanURL: https://olm.operatorframework.io/docs/
    properties:
      - type: Documentation
        url: https://olm.operatorframework.io/docs/
    tags:
      - Installations
      - Lifecycle Management
      - Updates
    tags_raw:
      - Installation
      - Lifecycle Management
      - Updates
  - aid: operator-framework:operator-sdk
    name: Operator SDK
    description: >-
      The Operator SDK provides tools for building Kubernetes operators.
      It includes scaffolding commands, code generation for CRD types and
      controllers, integration testing harness, scorecard for validating
      operator quality, and bundle commands for packaging operators for
      distribution through OLM catalogs.
    humanURL: https://sdk.operatorframework.io/docs/
    properties:
      - type: Documentation
        url: https://sdk.operatorframework.io/docs/
    tags:
      - Code Generation
      - Scaffolding
      - SDK
